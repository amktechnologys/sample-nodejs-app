version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:18.0

    steps:
      - checkout

      - setup_remote_docker

      - run:
          name: Install AWS CLI
          command: |
            sudo apt-get update
            sudo apt-get install -y awscli

      - run:
          name: Build Docker Image
          command: |
            docker build -t gitops-demo:1.0 .

      - run:
          name: Login to ECR
          command: |
            aws ecr get-login-password --region us-east-1 \
            | docker login \
            --username AWS \
            --password-stdin 662252246197.dkr.ecr.us-east-1.amazonaws.com/gitops-demo

      - run:
          name: Push Docker Image
          command: |
            docker tag gitops-demo:1.0 \
            662252246197.dkr.ecr.us-east-1.amazonaws.com/gitops-demo:1.0

            docker push \
            662252246197.dkr.ecr.us-east-1.amazonaws.com/gitops-demo:1.0
